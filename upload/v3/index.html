<style>
:root{--ink:#111;--teal:#26474a;--soft:#4b5a5b;--muted:#7a8586;--cream:#fdf5ee;--turquoise:#9ad8dc;--peach:#f6c38f;--coral:#ef6c5a;--salmon:#f3b3a5;--hash:#f2a585;--blue:#6f7ff0;--r:22px 22px 22px 6px;--leaf:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27140%27%20height%3D%27140%27%20viewBox%3D%270%200%20140%20140%27%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-opacity%3D%27.55%27%20stroke-width%3D%272%27%3E%3Cpath%20d%3D%27M18%2066c0-24%2018-42%2042-42%200%2024-18%2042-42%2042zM18%2066l42-42%27/%3E%3Cpath%20d%3D%27M80%20128c0-21%2016-37%2037-37%200%2021-16%2037-37%2037zM80%20128l37-37%27/%3E%3Cpath%20d%3D%27M96%2044c10-14%2026-18%2038-14-4%2014-20%2022-38%2014zM96%2044l38-14%27/%3E%3C/svg%3E");--font:'Poppins',system-ui,sans-serif}

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--teal);font:400 15px/1.55 var(--font);-webkit-font-smoothing:antialiased}button,input{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}img{max-width:100%;display:block}[hidden]{display:none!important}
.container{width:min(1184px,calc(100% - 32px));margin-inline:auto}

.site-header{position:sticky;top:0;z-index:40;background:#fff;box-shadow:0 6px 18px rgba(38,71,74,.05)}.header-main{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:40px;min-height:84px}

.search{display:flex;align-items:center;height:48px;margin:0;padding:0 8px 0 22px;border-radius:14px;background:var(--cream)}.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:14px;color:var(--ink)}.search button{width:36px;height:36px;display:grid;place-items:center;padding:0;border:0;background:none;color:var(--ink)}.search svg{width:18px;height:18px}

.hero{padding-block:34px 10px}.slider{position:relative}.slides{display:grid}

.banner:before{content:"";position:absolute;inset:0;background:var(--leaf) 0 0/140px;opacity:.45}.slide-promo{background:linear-gradient(120deg,#f6a28f,#fcd2c3)}.slide-new{background:linear-gradient(120deg,#9ad8dc,#d6f0f1)}.slide-ramadan,.slide-eid{background:linear-gradient(120deg,#f6d79e,#fcefd6)}
.banner-copy,.banner-products{position:relative;z-index:1}.banner-tag{display:inline-block;margin-bottom:12px;padding:4px 14px;border-radius:12px 12px 12px 3px;background:#fff;color:var(--coral);font-size:14px;font-weight:600}
.banner-title{margin:0;color:var(--ink);font-size:clamp(32px,3.8vw,48px);font-weight:700;line-height:1.08;letter-spacing:-.02em}.banner-title em{font-style:normal;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.12)}.slide-new .banner-title em,.slide-ramadan .banner-title em,.slide-eid .banner-title em,.slide-main .banner-title em{color:var(--coral);text-shadow:none}
.banner-text{max-width:440px;margin:12px 0 10px;color:var(--soft);font-size:15px}.banner-price{margin:0 0 18px;color:var(--ink);font-weight:500}.banner-price b{margin-inline-start:4px;color:var(--coral);font-size:22px;font-weight:700}.slide-promo .banner-price b{color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border:0;border-radius:12px 12px 12px 3px;font-size:14px;font-weight:600;white-space:nowrap;transition:background .2s,transform .2s}.btn:hover{transform:translateY(-1px)}.btn svg{width:17px;height:17px;flex:none}.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:#5b6be0}.btn-white{background:#fff;color:var(--ink)}.btn-coral{background:var(--coral);color:#fff}.btn-coral:hover{background:#dc5745}
.banner-actions{display:flex;flex-wrap:wrap;gap:10px}.banner-products{height:280px}.bp{position:absolute;filter:drop-shadow(0 14px 16px rgba(60,30,40,.14))}.bp1{width:80%;left:10%;top:-12%;z-index:1}.bp2{width:56%;inset-inline-start:-6%;bottom:-8%;rotate:-9deg;z-index:2}.bp3{width:52%;inset-inline-end:-6%;bottom:-4%;rotate:8deg;z-index:2}
.banner.active .banner-copy>*{animation:rise .7s .15s both}.banner.active .bp{animation:rise .8s .2s both}.banner.active .bp2{animation-delay:.3s}.banner.active .bp3{animation-delay:.4s}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.season-deco{position:absolute;z-index:1;color:#b98b3e;pointer-events:none}.deco-lanterns{top:0;inset-inline-start:48%;width:80px}.deco-moon{top:26px;inset-inline-end:6%;width:60px}
.dots{display:flex;justify-content:center;gap:8px;margin-top:18px}.dot{width:12px;height:12px;padding:0;border:0;border-radius:50%;background:#cfe9eb}.dot.active{background:var(--turquoise)}.slider.single .dots{display:none}

.section{padding-block:44px 0}.section-title{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 22px;color:var(--ink);font-size:clamp(26px,3vw,36px);font-weight:600;letter-spacing:-.01em}.section-title .hash{color:var(--hash)}.section-title a{color:var(--ink);font-size:13px;font-weight:600;white-space:nowrap}.section-title a:hover{color:var(--coral)}
.band{margin-top:44px;padding-block:40px 46px}.band .section{padding-top:0}.band-pink{background-color:var(--salmon)}.band-mint{background-color:#c6e9df}.band-peach{background-color:var(--peach)}.offers-band{padding-block:6px 34px;background-color:var(--cream)}

.offer{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:400px;padding:30px 18px 24px;overflow:hidden;border-radius:14px;color:#fff;text-align:center;scroll-snap-align:start;background:linear-gradient(160deg,#d59384,#b56f63)}
.offer:nth-child(4n+2){background:linear-gradient(160deg,#e8a784,#c77a63)}.offer:nth-child(4n+3){background:linear-gradient(160deg,#c98a6b,#a5664b)}.offer:nth-child(4n+4){background:linear-gradient(160deg,#e3a08b,#c27b6e)}
.offer-title{position:relative;z-index:1;font-size:26px;font-weight:800;line-height:1.08;text-transform:uppercase;text-shadow:0 2px 6px rgba(0,0,0,.18)}.offer img{width:88%;margin:-6px 0 -18px;filter:drop-shadow(0 18px 20px rgba(0,0,0,.25));transition:transform .4s}.offer:hover img{transform:scale(1.05) rotate(-3deg)}
.offer del{position:relative;font-size:26px;font-weight:800;text-decoration:none;opacity:.95}.offer del:after{content:"";position:absolute;inset:50% -4px auto;height:4px;background:#e53935;transform:rotate(-4deg)}.offer b{font-size:40px;font-weight:800;line-height:1;text-shadow:0 3px 8px rgba(0,0,0,.2)}
.offer-all{justify-content:center;gap:16px;background:linear-gradient(160deg,#9ad8dc,#5fb7bd)!important}.offer-all b{font-size:30px}.offer-all span{padding:10px 18px;border-radius:12px 12px 12px 3px;background:#fff;color:var(--teal);font-weight:600}

.row{display:grid;grid-template-columns:270px 1fr;gap:20px;align-items:stretch}.row.flip{grid-template-columns:1fr 270px}.row.flip .poster{order:2}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 60px)/4);gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}.rail>*{scroll-snap-align:start}
.poster{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:440px;padding:26px 18px;overflow:hidden;border-radius:14px;color:#fff;text-align:center}
.poster-big{font:800 58px/.92 Georgia,'Times New Roman',serif;letter-spacing:-.02em;text-transform:uppercase}.poster small{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.poster-promo{background:radial-gradient(circle at 30% 18%,#f7a65c,#d2522b 60%,#a8361b)}.poster-promo .poster-big{color:#fde9d0}.poster-promo b{padding:6px 14px;border-radius:12px 12px 12px 3px;background:#fff;color:#c8431f;font-size:22px}
.poster-new{background:repeating-conic-gradient(#d8262c 0 25%,#f6a4c0 0 50%) 0 0/64px 64px}.poster-new .poster-big{font-size:44px;color:#fff;text-shadow:0 4px 0 #8f1418,0 8px 18px rgba(0,0,0,.3)}.poster-new small{padding:4px 10px;border-radius:6px;background:#d8262c}
.poster-love{background:#f9cdd8;color:#c4262e}.poster-love .poster-big{font-family:var(--font);font-weight:800;font-size:46px}.poster-love svg{width:96px;height:96px}
/* product card */
.card{position:relative;display:flex;flex-direction:column;padding:16px 16px 18px;border-radius:var(--r);background:var(--cream)}.card-photo{position:relative;display:block;aspect-ratio:1;margin-bottom:16px;border-radius:4px;background:#fff}.card-photo img{width:100%;height:100%;object-fit:contain;padding:6%;transition:transform .4s}.card:hover .card-photo img{transform:scale(1.05)}
.tag{position:absolute;top:-4px;inset-inline-start:-8px;z-index:1;padding:3px 12px;border-radius:14px 14px 14px 3px;background:var(--coral);color:#fff;font-size:13px}.tag.new{background:var(--teal)}.tag.low{background:#f0a35e}
.fav-btn{position:absolute;top:22px;inset-inline-end:22px;z-index:2;width:34px;height:34px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.9);color:var(--teal)}.fav-btn svg{width:19px;height:19px}.fav-btn:hover,.fav-btn[aria-pressed=true]{color:var(--coral)}.fav-btn[aria-pressed=true] svg{fill:currentColor}
.card-brand{margin:0 0 4px;color:var(--ink);font-size:13px;font-weight:700;text-transform:uppercase}.card-name{flex:1;margin:0 0 14px;font-size:15px;font-weight:400;line-height:1.35}.card-name a:hover{color:var(--coral)}
.card-price{min-height:46px;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:12px}.card-price del{color:#9aa3a4;font-size:14px}.card-price b{color:var(--teal);font-size:17px;font-weight:600}.card-price del+b{color:var(--coral);text-decoration:underline;text-underline-offset:3px}
.buy{min-height:38px;font-size:13px;text-transform:uppercase}
/* categories band */
.cat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.cat{display:block}.cat-img{position:relative;aspect-ratio:1.05;overflow:hidden;border-radius:var(--r);background:#fff}.cat:nth-child(2) .cat-img{background:#fff3e6}.cat:nth-child(3) .cat-img{background:#eaf7f7}.cat:nth-child(4) .cat-img{background:#fdeef2}
.cat-img img{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain;transition:transform .4s}.cat:hover .cat-img img{transform:scale(1.07) rotate(-4deg)}.cat b{display:block;margin-top:12px;padding-inline-start:14px;color:var(--ink);font-size:15px;font-weight:600}.cat span{padding-inline-start:14px;font-size:13px}
/* shop grid */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}.chip{padding:7px 16px;border:0;border-radius:12px 12px 12px 3px;background:var(--cream);font-size:14px;font-weight:500}.chip:hover{background:#fbe6d4}.chip.active{background:var(--teal);color:#fff}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.empty{grid-column:1/-1;padding:50px;border-radius:var(--r);background:var(--cream);color:var(--muted);text-align:center}

.reviews{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}.reviews-side{display:grid;gap:20px}.review{display:flex;flex-direction:column;justify-content:space-between;padding:28px;border-radius:14px 14px 50px 14px;background:var(--cream)}.reviews>.review{background:linear-gradient(150deg,#9ad8dc,#c9ecee)}.reviews>.review blockquote{font-size:20px}
.review .stars{color:#f0a35e;letter-spacing:2px}.review blockquote{margin:10px 0 16px;color:var(--ink);font-size:16px}.review strong{display:block;color:var(--ink);font-weight:600}.review span{font-size:14px}

.socials{display:flex;gap:14px}.socials a{color:var(--teal)}.socials a:hover{color:var(--coral)}.socials svg{width:24px;height:24px}

.product-modal{position:relative;width:min(920px,100%);max-height:min(760px,92vh);overflow:auto;display:grid;grid-template-columns:1fr 1fr;border-radius:16px 16px 60px 16px;background:#fff}.modal-image{min-height:460px;background:var(--cream)}.modal-image img{width:100%;height:100%;object-fit:cover}
.modal-content{display:flex;flex-direction:column;gap:14px;padding:38px 32px}.modal-close{position:absolute;top:12px;inset-inline-end:12px;z-index:2;width:38px;height:38px;border:0;border-radius:50%;background:#fff;font-size:24px;line-height:1;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.modal-cat{color:var(--ink);font-size:13px;font-weight:700;text-transform:uppercase}.modal-content h2{margin:0;color:var(--ink);font-size:26px;font-weight:600;line-height:1.25}.stars{color:#f0a35e}.stars span{color:var(--muted);font-size:13px}.modal-price{display:flex;align-items:baseline;gap:10px}.modal-price b{color:var(--coral);font-size:26px;font-weight:700}.modal-price del{color:#9aa3a4}.modal-content p{margin:0}
.modal-label{margin-bottom:8px;color:var(--muted);font-size:13px;font-weight:500}.variant-options{display:flex;flex-wrap:wrap;gap:8px}.variant-btn{padding:8px 15px;border:0;border-radius:12px 12px 12px 3px;background:var(--cream);font-size:14px}.variant-btn.selected{background:var(--teal);color:#fff}
.qty-control{display:inline-flex;align-items:center;border-radius:12px 12px 12px 3px;background:var(--cream)}.qty-control button{width:40px;height:40px;border:0;background:none;font-size:18px}.qty-control span{min-width:30px;font-weight:600;text-align:center}.modal-stock{color:#2e7d32;font-size:14px}.modal-actions{display:grid;gap:10px}.modal-actions .btn{min-height:48px}.btn-cream{background:var(--cream);color:var(--ink)}.modal-ref{color:var(--muted);font-size:12px}
/* responsive */

function renderModal(){const p=PRODUCTS[currentProduct],tr=T[lang],variant=selectedVariants[currentProduct]||0;$('#modalImg').src=p.img;$('#modalImg').alt=p[lang][0];$('#modalCat').textContent=label(catOf(p));$('#modalName').textContent=p[lang][0];$('#modalStars').innerHTML=`${'★'.repeat(p.r)}${'☆'.repeat(5-p.r)} <span>${p.rate} · ${p.reviews} ${tr.reviews}</span>`;$('#modalPrice').innerHTML=(p.was?`<del>${money(p.was)}</del>`:'')+`<b>${money(p.price)}</b>`;$('#modalDesc').textContent=p[lang][1];
$('#modalVariantLabel').textContent=p.v.length>1&&p.cat==='makeup'?tr.mShade:tr.mFormat;$('#modalVariants').innerHTML=p.v.map((v,j)=>`<button class="variant-btn${j===variant?' selected':''}" data-variant="${j}">${v[lang==='fr'?0:1]}</button>`).join('');
$('#qtyValue').textContent=quantity;$('#modalStock').textContent=p.stock<=5?tr.mLow.replace('{n}',p.stock):tr.mIn;$('#modalRef').textContent=tr.ref+' '+p.ref;$('#modalOrder').innerHTML=ICON.wa+tr.mOrder+' · '+money(p.price*quantity);$('#modalOrder').href=wa(orderMessage(p,quantity,variant));$('#modalShareLabel').textContent=tr.share}
async function shareProduct(){const p=PRODUCTS[currentProduct],url=productUrl(p);try{if(navigator.share){await navigator.share({title:p[lang][0]+' — '+STORE_NAME,text:p[lang][0]+' · '+money(p.price),url});return}await navigator.clipboard.writeText(url);$('#modalShareLabel').textContent=T[lang].copied;setTimeout(()=>{$('#modalShareLabel').textContent=T[lang].share},2000)}catch(e){if(e.name!=='AbortError')window.prompt(T[lang].share,url)}}
// Events
function setDrawer(open){document.body.classList.toggle('drawer-open',open);$('#menuToggle').setAttribute('aria-expanded',String(open))}
document.addEventListener('click',e=>{const t=e.target.closest('[data-filter],[data-set-filter],[data-fav],[data-clear-search],[data-slide],[data-variant],[data-open-drawer]');if(!t)return;const d=t.dataset;
if(d.fav){toggleFav(d.fav);return}if(d.openDrawer!==undefined){setDrawer(true);return}if(d.filter){query='';$('#search').value='';setFilter(d.filter);setDrawer(false)}else if(d.setFilter)setFilter(d.setFilter);else if(d.clearSearch!==undefined){query='';$('#search').value='';renderGrid()}
else if(d.slide){goSlide(Number(d.slide));startAuto()}else if(d.variant){selectedVariants[currentProduct]=Number(d.variant);renderModal()}});
$('#menuToggle').addEventListener('click',()=>setDrawer(true));$('#drawerClose').addEventListener('click',()=>setDrawer(false));$('#drawerBackdrop').addEventListener('click',()=>setDrawer(false));$$('#drawer a').forEach(a=>a.addEventListener('click',()=>setDrawer(false)));
$('#searchToggle').addEventListener('click',()=>{const f=$('#searchForm');f.classList.toggle('open');if(f.classList.contains('open'))$('#search').focus()});
$('#search').addEventListener('input',e=>{query=e.target.value.trim();if(query&&filter!=='all'){filter='all';renderChips()}renderGrid()});$('#searchForm').addEventListener('submit',e=>{e.preventDefault();$('#search').blur();$('#shop').scrollIntoView()});
['#langToggle','#langToggle2'].forEach(s=>$(s).addEventListener('click',()=>{lang=lang==='fr'?'ar':'fr';applyLanguage();setDrawer(false)}));
{const slider=$('.slider');let x0=null;slider.addEventListener('mouseenter',()=>slidePaused=true);slider.addEventListener('mouseleave',()=>slidePaused=false);slider.addEventListener('focusin',()=>slidePaused=true);slider.addEventListener('focusout',()=>slidePaused=false);
slider.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});slider.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>45){goSlide(slideIdx+((dx<0)!==(lang==='ar')?1:-1));startAuto()}})}
$('#modalClose').addEventListener('click',closeModal);$('#productModal').addEventListener('click',e=>{if(e.target.id==='productModal')closeModal()});$('#modalShare').addEventListener('click',shareProduct);
$('#qtyMinus').addEventListener('click',()=>{quantity=Math.max(1,quantity-1);renderModal()});$('#qtyPlus').addEventListener('click',()=>{quantity=Math.min(PRODUCTS[currentProduct].stock,quantity+1);renderModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();setDrawer(false)}});window.addEventListener('hashchange',()=>route(true));
$('#year').textContent=new Date().getFullYear();updateFavCount();applyLanguage();route(false);
</script>
</body>
</html>
