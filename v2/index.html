<style>
:root{--bg:#f5f6f8;--text:#242424;--soft:#555;--muted:#777;--line:#e6e6e6;--taupe:#8f6d55;--taupe-light:#a3826a;--crimson:#c7044c;--red:#d10f1f;--font:'Jost',system-ui,sans-serif}

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.6 var(--font);-webkit-font-smoothing:antialiased}button,input{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}img{max-width:100%;display:block}[hidden]{display:none!important}
.container{width:min(1280px,calc(100% - 30px));margin-inline:auto}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border:0;border-radius:99px;font-size:15px;font-weight:500;white-space:nowrap;transition:background .2s,color .2s,transform .2s}.pill svg{width:17px;height:17px}.pill:hover{transform:translateY(-1px)}

/* announcement + header */
.announce{background:var(--text);color:#fff;text-align:center;font-size:15px;padding:8px 15px}
.site-header{position:sticky;top:0;z-index:40;background:#fff}.header-main{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"brand search tools";align-items:center;gap:40px;min-height:88px}.menu-btn{grid-area:menu}.brand{grid-area:brand}.header-tools{grid-area:tools}
.nav-row{border-top:1px solid var(--line)}.nav-links{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 38px;min-height:50px}.nav-links>a.nav-hot{color:var(--crimson);font-weight:500}.nav-links>a,.cat-menu>button{padding:6px 0;border:0;background:none;font-size:16px}.nav-links>a:hover,.cat-menu>button:hover{color:var(--taupe)}
.cat-menu{position:relative}.cat-menu>button{display:inline-flex;align-items:center;gap:4px}.cat-menu>button svg{width:12px;height:12px;color:var(--muted)}
.cat-drop{position:absolute;top:100%;inset-inline-start:-16px;z-index:5;min-width:230px;padding:10px 0;border-radius:10px;background:#fff;box-shadow:0 14px 40px rgba(0,0,0,.12);opacity:0;visibility:hidden;transform:translateY(6px);transition:.2s}.cat-menu:hover .cat-drop,.cat-menu:focus-within .cat-drop{opacity:1;visibility:visible;transform:none}.cat-drop a{display:block;padding:9px 20px;font-size:15px}.cat-drop a:hover{background:var(--bg);color:var(--taupe)}
.brand{display:flex;flex-direction:column;align-items:center;line-height:1;color:var(--taupe-light)}.brand b{font-size:31px;font-weight:500;letter-spacing:.14em}.brand small{margin-top:5px;font-size:9px;letter-spacing:.62em;color:var(--muted);padding-inline-start:.62em}
.header-tools{justify-self:end;display:flex;align-items:center;gap:14px}.search{grid-area:search;justify-self:center;display:flex;align-items:center;width:min(520px,100%);height:46px;margin:0;padding:0 8px 0 18px;border:1px solid var(--line);border-radius:99px;background:#fff}.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:14px}.search button{width:34px;height:34px;display:grid;place-items:center;padding:0;border:0;background:none;color:var(--muted)}.search svg{width:20px;height:20px}
.tool-sep{width:1px;height:40px;background:var(--line)}.icon-link{position:relative;display:inline-flex;align-items:center;gap:6px;padding:0;border:0;background:none;font-size:16px}.icon-link svg{width:22px;height:22px}.icon-link:hover{color:var(--taupe)}
.lang-btn{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:13px}.lang-btn:hover{border-color:var(--taupe-light)}
.menu-btn,.search-toggle{display:none}

body.drawer-open .drawer{transform:none}body.drawer-open .drawer-backdrop{opacity:1;visibility:visible}.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.drawer-head button{width:38px;height:38px;border:0;border-radius:50%;background:var(--bg);font-size:22px;line-height:1}

/* hero */
.hero{display:grid;grid-template-columns:290px 1fr;gap:24px;align-items:stretch;padding-block:28px 20px}
.side-panel{display:flex;flex-direction:column;gap:4px;padding:20px 14px;border-radius:12px;background:#fff}.side-panel h3{margin:0 10px 8px;color:var(--muted);font-size:13px;font-weight:500;letter-spacing:.1em;text-transform:uppercase}.side-cats{display:grid;gap:2px}.side-cats a{display:flex;align-items:center;gap:14px;padding:9px 10px;border-radius:10px;font-size:17px;line-height:1.25;transition:background .2s,color .2s}.side-cats a:hover{background:var(--bg);color:var(--taupe)}.side-cats img{width:50px;height:50px;flex:none;padding:5px;border-radius:50%;background:var(--bg);object-fit:contain;transition:transform .3s}.side-cats a:hover img{transform:rotate(-8deg) scale(1.08)}.side-cats span{flex:1}.side-cats small{display:block;color:var(--muted);font-size:13px}.side-cats svg{width:16px;height:16px;color:#bbb}[dir=rtl] .side-cats svg{transform:scaleX(-1)}.side-promo{margin-top:auto;display:block;padding:18px 18px 16px;border-radius:10px;background:linear-gradient(135deg,var(--crimson),#e2447b);color:#fff;transition:transform .2s}.side-promo:hover{transform:translateY(-2px)}.side-promo b{display:block;font-size:30px;font-weight:600;line-height:1.05}.side-promo span{font-size:14px;opacity:.92}

.slide-promo{background:linear-gradient(120deg,#fbd5dc,#fde9ec)}.slide-new{background:linear-gradient(120deg,#e3eef2,#f3f8fa)}.slide-ramadan,.slide-eid{background:linear-gradient(120deg,#f4e5c6,#fbf4e6)}
.banner-tag{display:inline-block;margin-bottom:14px;padding:3px 12px;border-radius:99px;background:rgba(255,255,255,.75);color:var(--taupe);font-size:14px}
.banner-title{margin:0;font-size:clamp(34px,4vw,52px);font-weight:500;line-height:1.1}.banner-title em{font-style:normal;color:var(--crimson)}
.banner-text{max-width:430px;margin:16px 0 12px;color:var(--soft);font-size:16px}.banner-price{margin:0 0 22px;font-size:15px}.banner-price b{color:var(--crimson);font-size:22px;font-weight:600;margin-inline-start:4px}.banner-actions{display:flex;flex-wrap:wrap;gap:10px}
.banner-products{position:relative;height:380px}.bp{position:absolute;filter:drop-shadow(0 16px 18px rgba(60,30,40,.12))}.bp1{width:84%;left:8%;top:-6%;z-index:1}.bp2{width:58%;inset-inline-start:-8%;bottom:-6%;rotate:-9deg;z-index:2}.bp3{width:54%;inset-inline-end:-8%;bottom:-2%;rotate:8deg;z-index:2}
.banner.active .banner-copy>*{animation:rise .7s .15s both}.banner.active .bp{animation:rise .8s .2s both}.banner.active .bp2{animation-delay:.3s}.banner.active .bp3{animation-delay:.4s}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.promo-badge{position:absolute;top:0;inset-inline-end:4%;z-index:3;width:92px;height:92px;display:grid;place-content:center;text-align:center;border-radius:50%;background:var(--red);color:#fff;rotate:-8deg}.promo-badge b{font-size:26px;line-height:1}.promo-badge small{font-size:10px;letter-spacing:.15em}
.season-deco{position:absolute;z-index:1;color:#c9a15a;pointer-events:none}.deco-lanterns{top:0;inset-inline-start:46%;width:86px}.deco-moon{top:30px;inset-inline-end:7%;width:66px}
.slide-arrow{position:absolute;top:calc(50% - 16px);transform:translateY(-50%);z-index:3;width:40px;height:40px;display:grid;place-items:center;padding:0;border:0;background:none;color:var(--text)}.slide-arrow svg{width:26px;height:26px;stroke-width:1.4}.slide-arrow.prev{inset-inline-start:10px}.slide-arrow.next{inset-inline-end:10px}[dir=rtl] .slide-arrow svg,[dir=rtl] .rail-arrow svg{transform:scaleX(-1)}
.dots{position:absolute;bottom:44px;left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:8px}.dot{width:9px;height:9px;padding:0;border:0;border-radius:50%;background:rgba(0,0,0,.18)}.dot.active{background:var(--crimson)}.slider.single .slide-arrow,.slider.single .dots{display:none}
.ticker{position:relative;z-index:3;overflow:hidden;background:var(--text);color:#fff;font-size:15px;white-space:nowrap}.ticker-track{display:inline-flex;gap:0;padding:7px 0;animation:ticker 32s linear infinite}.ticker-track span{padding-inline:22px}[dir=rtl] .ticker-track{animation-name:ticker-rtl}
@keyframes ticker{to{transform:translateX(-50%)}}@keyframes ticker-rtl{to{transform:translateX(50%)}}

.advice-visual{position:relative;height:280px}.advice-visual .bp1{width:58%;left:21%;top:2%}.advice-visual .bp2{width:42%;bottom:4%}.advice-visual .bp3{width:40%;bottom:6%}.advice-visual:before{content:"";position:absolute;inset:6% 14%;border-radius:50%;background:rgba(255,255,255,.45)}

.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:26px}.chip{padding:7px 16px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:14px}.chip:hover{border-color:var(--taupe-light)}.chip.active{border-color:var(--text);background:var(--text);color:#fff}

.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}.empty{grid-column:1/-1;padding:50px;border-radius:10px;background:#fff;color:var(--muted);text-align:center}

.modal-cat{color:var(--taupe);font-size:14px}.modal-content h2{margin:0;font-size:26px;font-weight:500;line-height:1.25;text-transform:uppercase}.stars{color:#f5a623}.stars span{color:var(--muted);font-size:13px}.modal-price{display:flex;align-items:baseline;gap:10px}.modal-price b{color:var(--taupe);font-size:26px;font-weight:600}.modal-price del{color:#aaa}.modal-content p{margin:0;color:var(--soft)}

slider.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});slider.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>45){goSlide(slideIdx+((dx<0)!==(lang==='ar')?1:-1));startAuto()}})}
